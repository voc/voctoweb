"""
This entity groups multiple items together, e.g. a Conference or Lecture Series
"""
type Conference {
  """
  The acronym of this conference, used as its identifier
  """
  acronym: Slug!

  """
  The aspect ratio of the conference's recordings
  """
  aspectRatio: String!

  """
  The conference's description
  """
  description: String

  """
  when was an item last added in this grouping
  """
  eventLastReleasedAt: DateTime
  id: ID!

  """
  All images assigned to this conference, includes banner, logos in light & dark variants, etc.
  """
  images: [Image!]!

  """
  A URL pointing to the root of all image files of this conference
  """
  imagesUrl: URL! @deprecated(reason: "Use the `images` field instead")
  items(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): LectureConnection
  lectures(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): LectureConnection @deprecated(reason: "Use the `items` field instead, which is a more generic name for the same query")

  """
  A URL pointing to the conference's own website
  """
  link: URL

  """
  The conference's logo
  """
  logo(prefer: ImageMimeTypeEnum): Image

  """
  A URL pointing to the conference's logo
  """
  logoUrl: URL @deprecated(reason: "Use the `logo` field instead")

  """
  The raw metadata for this conference, as stored in the database
  """
  metadataRaw: JSON @deprecated(reason: "experimental")

  """
  A URL pointing to the root of all recording files of this conference
  """
  recordingsUrl: URL!

  """
  A URL pointing to the conference's frab xml schedule
  """
  scheduleUrl: URL

  """
  The URL slug of this conference
  """
  slug: Slug!

  """
  The raw streaming information for this conference, as provided by streaming v2 API
  """
  streamingRaw: JSON @deprecated(reason: "experimental")

  """
  The title of this conference
  """
  title: String!

  """
  Identifies the date and time when the object was last updated
  """
  updatedAt: DateTime!

  """
  A URL pointing to the conference page in vocotweb frontend
  """
  url: URL!
}

"""
The connection type for Conference.
"""
type ConferenceConnection {
  """
  A list of nodes.
  """
  nodes: [Conference]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

input ConferenceFilter {
  OR: [ConferenceFilter!]
  currentlyStreaming: Boolean
  urlContains: String
}

enum ConferenceOrderBy {
  createdAt_ASC
  createdAt_DESC
}

"""
An ISO 8601-encoded datetime
"""
scalar DateTime

"""
An image e.g. logo or banner, with basic metadata
"""
type Image {
  """
  The MIME type of the image, e.g. `image/png` or `image/svg+xml`
  """
  mimeType: String!

  """
  The purpose or type of the image
  """
  type: ImageTypeEnum

  """
  The URL of the image
  """
  url: URL!

  """
  The variant of the image, e.g. `light` or `dark` for logos
  """
  variant: ImageVariantEnum
}

"""
MIME type for images
"""
enum ImageMimeTypeEnum {
  """
  JPEG format
  """
  JPEG

  """
  PNG format
  """
  PNG

  """
  SVG format
  """
  SVG

  """
  WebP format
  """
  WEBP
}

"""
Type or purpose of the image
"""
enum ImageTypeEnum {
  """
  Banner image
  """
  BANNER

  """
  Logo image
  """
  LOGO

  """
  Other image type
  """
  OTHER

  """
  Poster image
  """
  POSTER

  """
  Thumbnail image
  """
  THUMBNAIL
}

"""
Variant of the image
"""
enum ImageVariantEnum {
  """
  Dark mode image
  """
  DARK

  """
  Light mode image
  """
  LIGHT
}

"""
Lookup key for finding a single item. Provide exactly one of the fields below.
"""
input ItemLookupInput {
  """
  The item's guid
  """
  guid: ID

  """
  The item's URL slug
  """
  slug: ID
}

"""
A untyped JSON document
"""
scalar JSON

"""
This entity is an Event with multiple Files e.g. Video and Audio recordings,
subtitles (SRT) as well as PDFs e.g. the lecture slides
"""
type Lecture {
  """
  all audio recordings assigned to this item
  """
  audios: [Resource!]!

  """
  The conference this event belongs to
  """
  conference: Conference!

  """
  Identifies the date and time when the event took place
  """
  date: DateTime

  """
  The event's description
  """
  description: String

  """
  Digital Object Identifier (DOI) e.g. https://doi.org/10.5446/19566
  """
  doiUrl: URL

  """
  The lecture recording duration in seconds
  """
  duration: Int
  files(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): ResourceConnection!
  guid: ID!
  images: LectureImage!

  """
  URL pointing to the conference event website
  """
  link: URL
  localId: Int!

  """
  The event's original language, encoded as ISO 639-2
  """
  originalLanguage: String

  """
  Names of persons that held the event
  """
  persons: [String!]
  playerConfig: JSON

  """
  Whether the event is promoted right now
  """
  promoted: Boolean

  """
  Identifies the date when the event got released
  """
  releaseDate: DateTime
  relive: JSON

  """
  PDF slides, if provided
  """
  slides: [Resource!]!

  """
  The URL slug of this event
  """
  slug: Slug!

  """
  The event's subtitle that may be displayed below the title
  """
  subtitle: String
  subtitles: [Resource!]!

  """
  Tags/keywords describing the event
  """
  tags: [String!]
  timelens: LectureTimelens!

  """
  The title of this event
  """
  title: String!

  """
  The languages this event has been translated into, encoded as ISO 639-2
  """
  translations: [String!]

  """
  Identifies the date and time when the object was last updated
  """
  updatedAt: DateTime

  """
  A URL pointing to this lecture's page in vocotweb frontend
  """
  url: URL!

  """
  main MP4 video, possibly with multiple audio and video tracks
  """
  video(prefer: [VideoPreferenceEnum!], quality: VideoQualityEnum): Resource!

  """
  simlified access to single language video in original language
  """
  videoPreferred: Resource!

  """
  all video recordings assigned to this item
  """
  videos: [Resource!]!

  """
  The amount of views of this event
  """
  viewCount: Int
}

"""
The connection type for Lecture.
"""
type LectureConnection {
  """
  A list of nodes.
  """
  nodes: [Lecture]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

input LectureFilter {
  OR: [LectureFilter!]
  tagsContains: [String!]
}

type LectureImage {
  """
  URL pointing to a preview/poster image of the event
  """
  posterUrl: URL

  """
  URL pointing to a smaller version of the poster image
  """
  thumbUrl: URL
}

enum LectureOrderBy {
  date_ASC
  date_DESC
  viewCount_ASC
  viewCount_DESC
}

type LectureTimelens {
  """
  URL pointing to scrubbing thumbnails for timelens/timeline
  """
  thumbnailsUrl: URL

  """
  URL pointing timelens timline image of the event
  """
  timelineUrl: URL
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!

  """
  When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!

  """
  When paginating backwards, the cursor to continue.
  """
  startCursor: String
}

type Query {
  _service: _Service!

  """
  All conferences with pagination support
  """
  allConferences(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): ConferenceConnection

  """
  Find a conference by acronym (e.g., `39c3`, `eh2010`)
  """
  conference(
    """
    The conference acronym
    """
    id: ID!
  ): Conference
  conferences(filter: ConferenceFilter, first: Int, offset: Int, orderBy: ConferenceOrderBy = createdAt_DESC): [Conference!]!

  """
  Recently active conferences with recorded events, ordered by most recent first
  """
  conferencesRecent(
    """
    Number of conferences to return (max 30)
    """
    first: Int! = 5

    """
    Offset for pagination
    """
    offset: Int = 0
  ): [Conference!]

  """
  Find a single item by guid or slug
  """
  item(by: ItemLookupInput!): Lecture
  items(filter: LectureFilter, first: Int, offset: Int, orderBy: LectureOrderBy = date_DESC): [Lecture!]!

  """
  Find a lecture by guid
  """
  lecture(guid: ID!): Lecture @deprecated(reason: "Use `item(by: {guid: \"<guid>\"})` instead, which is a more generic name for the same query")

  """
  Find a lecture by slug
  """
  lectureBySlug(slug: ID!): Lecture @deprecated(reason: "Use `item(by: {slug: \"slug>\"})` instead, which is a more generic name for the same query")
  lectureSearch(page: Int, query: String!): [Lecture!]!
  lectures(filter: LectureFilter, first: Int, offset: Int, orderBy: LectureOrderBy = date_DESC): [Lecture!]! @deprecated(reason: "Use items instead, which is a more generic name for the same query")

  """
  A list of related items
  """
  lecturesRelatedTo(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int
    guid: ID!

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): LectureConnection

  """
  Promoted lectures featured on the start page
  """
  promoted(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Offset for pagination
    """
    offset: Int = 0
  ): LectureConnection
}

"""
Files like videos, audios, SRTs or PDFs
"""
type Resource {
  """
  The recordings's duration in seconds
  """
  duration: Int!
  filename: String!

  """
  The height of this recording in px, if it is a video
  """
  height: Int!

  """
  Whether this recording is a video with at least 720p resolution
  """
  highQuality: Boolean!
  label: String!

  """
  The recordings's language, encoded as ISO 639-2
  """
  language: String

  """
  The recordings's mime type, e.g. `video/mp4`
  """
  mimeType: String!

  """
  The recording's approximate size, in the unit given by `unit` (defaults to megabytes)
  """
  size(
    """
    The unit to express the size in
    """
    unit: SizeUnit = MB
  ): Int!

  """
  Identifies the date and time when the object was last updated
  """
  updatedAt: DateTime!

  """
  A URL pointing to the CDN location of this recording
  """
  url: URL!

  """
  The width of this recording in px, if it is a video
  """
  width: Int!
}

"""
The connection type for Resource.
"""
type ResourceConnection {
  """
  A list of nodes.
  """
  nodes: [Resource]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
The unit a recording's size is expressed in
"""
enum SizeUnit {
  """
  Bytes
  """
  BYTE

  """
  Gigabytes
  """
  GB

  """
  Megabytes
  """
  MB
}

"""
A URL slug (no forward slashes)
"""
scalar Slug

"""
A valid URL, transported as a string
"""
scalar URL

"""
Preferred video format
"""
enum VideoPreferenceEnum {
  """
  AV1 video codec (WebM container)
  """
  AV1

  """
  DASH streaming format
  """
  DASH

  """
  MPEG-4 video format
  """
  MP4

  """
  WebM video format
  """
  WEBM
}

"""
Preferred video quality tier
"""
enum VideoQualityEnum {
  """
  High quality
  """
  HQ

  """
  Low quality
  """
  LQ

  """
  Original master quality, largest file size
  """
  ORIGINAL
}

"""
The sdl representing the federated service capabilities. Includes federation
directives, removes federation types, and includes rest of full schema after
schema directives have been applied
"""
type _Service {
  sdl: String
}
